<!DOCTYPE html>
<html>
<head>
  <title>GTA 6 Companion</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>GTA 6 Companion</h1>
    <p>Your helper while you play on PS5. Search on your phone, get answer in 5 seconds.</p>
    <form action="/guides">
      <input type="text" name="q" placeholder="Search: money, car, police...">
      <button>Search</button>
    </form>
    <div class="nav">
      <a href="/">Home</a> | <a href="/guides">All Guides</a> | <a href="/locations">All Locations</a>
    </div>
    <h2>Top Guides Today</h2>
    {% for g in guides %}
    <div class="card">
      <h3>{{ g.title }}</h3>
      <p><b>{{ g.money_per_hour }}</b> | {{ g.category }}</p>
      <p>{{ g.description }}</p>
      <p>{{ g.steps }}</p>
    </div>
    {% endfor %}
  </div>
</body>
</html>
